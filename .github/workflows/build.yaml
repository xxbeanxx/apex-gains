name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint:check
      - name: Run type check
        run: npm run typecheck
      - name: Check architecture boundaries
        run: npm run check:architecture
      - name: Run tests
        run: npm run test
      - name: Run persistence contract tests against Postgres
        run: npm run test:contract
        env:
          TEST_DATABASE_URL: postgres://apex:apex@localhost:5432/apex_contract

  migrate-database:
    name: Apply Database Migrations
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pending Drizzle migrations to Supabase
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tags.outputs.full_version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate image tags
        id: tags
        run: scripts/generate-image-tags.sh >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.repository }}
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build container image with Podman
        run: scripts/build-image.sh "${{ steps.tags.outputs.version_tag }}" "${{ steps.tags.outputs.full_version_tag }}" "${{ steps.tags.outputs.full_latest_tag }}"
      - name: Push container image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: scripts/push-image.sh "${{ steps.tags.outputs.full_version_tag }}" "${{ steps.tags.outputs.full_latest_tag }}"
      - name: Publish build summary
        if: always()
        run: |
          echo "## Container Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.tags.outputs.image_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Tag | \`${{ steps.tags.outputs.version_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest Tag | \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "| Push Status | ℹ️ Built and verified (push skipped: not a push to main) |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "| Push Status | 🚀 Successfully pushed to GHCR |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Push Status | ❌ Push failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Render
    needs: [migrate-database, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Install Render CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R render-oss/cli --pattern '*_linux_amd64.zip' --output render.zip
          unzip -o render.zip 'cli_*'
          sudo mv cli_* /usr/local/bin/render
          sudo chmod +x /usr/local/bin/render
      - name: Deploy image to Render
        run: |
          render deploys create srv-datp2m1srm7s739isf50 \
            --image "${{ needs.build.outputs.image_tag }}" \
            --wait --confirm -o json
