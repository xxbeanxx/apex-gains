name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Run tests
        run: npm run test

  migrate-database:
    name: Apply Database Migrations
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending Drizzle migrations to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

  build:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tags.outputs.full_version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # 8-digit date in UTC (e.g. 20260901)
          DATE=$(date --utc +'%Y%m%d')

          # 8-character commit SHA of what was actually checked out
          SHA="${GITHUB_SHA:0:8}"

          # Lowercase image repository name for GHCR
          IMAGE_NAME=$(echo "ghcr.io/${REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          # 8-character hex Unix timestamp (e.g. 66d5e2c0). Same width as
          # the SHA segment, and sorts correctly as a string until the
          # epoch exceeds 0xffffffff (year 2106).
          BUILD_NUM=$(printf '%08x' "$(date -u +%s)")

          # Tag format: date-sha-timestamp (e.g. 20260901-abcd1234-66d5e2c0)
          VERSION_TAG="${DATE}-${SHA}-${BUILD_NUM}"

          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full_version_tag=${IMAGE_NAME}:${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

          echo "Image tags generated:"
          echo "  - Version: ${IMAGE_NAME}:${VERSION_TAG}"
          echo "  - Latest:  ${IMAGE_NAME}:latest"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build container image with Podman
        run: |
          # Layer cache lives in the same GHCR repo the image tags are
          # pushed to (a bare repo ref, no tag - podman manages its own
          # cache references underneath it). Main pushes pull and update
          # cache; pull requests only pull the cache.
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CACHE_ARGS=(
              --cache-from "${{ steps.tags.outputs.image_name }}"
              --cache-to "${{ steps.tags.outputs.image_name }}"
            )
          else
            CACHE_ARGS=(
              --cache-from "${{ steps.tags.outputs.image_name }}"
            )
          fi

          podman build \
            --file containerfile \
            --build-arg VERSION_TAG="${{ steps.tags.outputs.version_tag }}" \
            --tag "${{ steps.tags.outputs.full_version_tag }}"              \
            --tag "${{ steps.tags.outputs.full_latest_tag }}"               \
            "${CACHE_ARGS[@]}" .

      - name: Push container image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          podman push "${{ steps.tags.outputs.full_version_tag }}"
          podman push "${{ steps.tags.outputs.full_latest_tag }}"

      - name: Publish build summary
        if: always()
        run: |
          echo "## Container Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.tags.outputs.image_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Tag | \`${{ steps.tags.outputs.version_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest Tag | \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "| Push Status | ℹ️ Built and verified (push skipped: not a push to main) |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "| Push Status | 🚀 Successfully pushed to GHCR |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Push Status | ❌ Push failed |" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Azure Container Apps
    needs: [migrate-database, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name apex-gains \
              --resource-group rg-apex-gains \
              --image "${{ needs.build.outputs.image_tag }}"
