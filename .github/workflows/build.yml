name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tags
        run: |
          # 8-digit date in UTC (e.g. 20260901)
          DATE=$(date -u +'%Y%m%d')

          # 8-character commit SHA
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$COMMIT_SHA" ]; then
            COMMIT_SHA=$(git rev-parse HEAD)
          fi
          SHA="${COMMIT_SHA:0:8}"

          # Lowercase image repository name for GHCR
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')

          # Query existing tags from GHCR to determine daily build number
          EXISTING_TAGS=$(skopeo list-tags --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${IMAGE_NAME}" 2>/dev/null || echo "{}")

          # Calculate build number: resets to 000 when date changes, increments otherwise
          BUILD_NUM=$(python3 -c '
          import json, os, re, sys

          date_str = sys.argv[1]
          tags_json_str = sys.argv[2]

          try:
              data = json.loads(tags_json_str) if tags_json_str else {}
              tags = data.get("Tags", []) or []
          except Exception:
              tags = []

          pattern = re.compile(rf"^{re.escape(date_str)}-[a-fA-F0-9]+-(\d{{3,}})$")
          max_num = -1

          for tag in tags:
              match = pattern.match(tag)
              if match:
                  num = int(match.group(1))
                  if num > max_num:
                      max_num = num

          next_num = max_num + 1 if max_num >= 0 else 0
          print(f"{next_num:03d}")
          ' "$DATE" "$EXISTING_TAGS")

          # Tag format: date-sha-XXX (e.g. 20260901-abcd1234-000)
          VERSION_TAG="${DATE}-${SHA}-${BUILD_NUM}"

          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "full_version_tag=${IMAGE_NAME}:${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

          echo "Image tags generated:"
          echo "  - Version: ${IMAGE_NAME}:${VERSION_TAG}"
          echo "  - Latest:  ${IMAGE_NAME}:latest"

      - name: Build container image with Podman
        run: |
          podman build \
            -f containerfile \
            -t "${{ steps.tags.outputs.full_version_tag }}" \
            -t "${{ steps.tags.outputs.full_latest_tag }}" \
            -t "apex-gains:${{ steps.tags.outputs.version_tag }}" \
            -t "apex-gains:latest" \
            .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push container image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          podman push "${{ steps.tags.outputs.full_version_tag }}"
          podman push "${{ steps.tags.outputs.full_latest_tag }}"

      - name: Publish build summary
        if: always()
        run: |
          echo "## Container Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.tags.outputs.image_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Tag | \`${{ steps.tags.outputs.version_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest Tag | \`latest\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "| Push Status | ℹ️ Built and verified (push skipped on pull request) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Push Status | 🚀 Successfully pushed to GHCR |" >> "$GITHUB_STEP_SUMMARY"
          fi
